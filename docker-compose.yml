name: ecommerce-mvp

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ecommerce-mvp-backend:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      MOCK_MODE: ${MOCK_MODE:-true}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      DATABASE_URL: sqlite:////app/data/runtime/ecommerce_mvp.db
      UPLOAD_DIR: /app/uploads
      GENERATED_DIR: /app/generated
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_IMAGE_API_KEY: ${QWEN_IMAGE_API_KEY:-}
      QWEN_IMAGE_BASE_URL: ${QWEN_IMAGE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-qwen-image-edit}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./data/runtime:/app/data/runtime
      - ./uploads:/app/uploads
      - ./generated:/app/generated
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ecommerce-mvp-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
